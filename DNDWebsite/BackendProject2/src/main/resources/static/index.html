<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/style_starting.css">
    <link rel="stylesheet" href="CSS/index.css">
    <script src="JavaScript/starting_page.js" defer></script>
</head>
<body>
    <main>
        <div class="login-container">
            <div class="intro">
                <h1>Welcome to the access Page</h1>
                <p>this is a passion project for me and my
                    friends in an attempt to make information free.
                    If you are interested in access, message 
                    me on discord with purpose, so I know you're not a scammer:
                    tkaciest
                </p>
            </div>
            <form class="login-container-small" id="login-form">
                <div class="user-pass">
                    <label for="username">Username:</label>
                    <input type="text" id="username" 
                    name="username" placeholder="Enter username">
                </div>
                <div class="user-pass">
                    <label for="password">Password:</label>
                    <input type="text" id="password" 
                    name="password" placeholder="Enter password">
                </div>
                <button id="input">Login</button>
            </form>
    
        </div>
    </main>

</body>
</html>
