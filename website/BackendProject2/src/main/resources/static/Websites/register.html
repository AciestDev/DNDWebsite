<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1hp</title>
    <link rel="icon" type="image/x-icon" href="../Images/tab-icon.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/static/index.css">
    <link rel="stylesheet" href="../CSS/static/buttons.css">
    <link rel="stylesheet" href="../CSS/static/card.css">
    <script src="../JavaScript/index.js" defer></script>
</head>
<body>
    <main>
        <div class="background">
            <header class="main-menu-header">
                <nav>
                    <a id="mainTitle" href="/api/me">1hp</a>
                </nav>
            </header>
            <div id="main-menu-container">
                <div class="main-page-login">
                    <form class="main-page-login-form" id="login-form">
                        <h2> Create your account here!</h2>
                        <div class="user-pass">
                            <label for="username">Username:</label>
                            <input type="text" id="username"
                            name="username" placeholder="Enter username" required>
                        </div>
                        <div class="user-pass">
                            <label for="password">Password:</label>
                            <input type="password" id="password"
                            name="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit">Sign up!</button>
                        <a>already have an account? Login</a>

                        <div id="responseMessage"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
